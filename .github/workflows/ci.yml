name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-api:
    runs-on: mac-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Install API deps
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -c requirements.lock -e '.[dev]'
      - name: Run API tests
        run: pytest -q

  migrate-postgres:
    # GitHub service containers run only on Linux, so this job cannot use mac-ci.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offline_test
          POSTGRES_PASSWORD: offline_test
          POSTGRES_DB: offline_test
        ports:
          - 15636:5432
        options: >-
          --health-cmd "pg_isready -U offline_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-membership:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: evalops
          POSTGRES_DB: evalops_membership_test
        ports:
          - 15634:5432
        options: >-
          --health-cmd "pg_isready -U evalops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 18684:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://offline_test:offline_test@127.0.0.1:15636/offline_test
      EVALOPS_OFFLINE_TEST_DATABASE_URL: postgresql+psycopg://offline_test:offline_test@127.0.0.1:15636/offline_test
      MEMBERSHIP_TEST_DATABASE_URL: postgresql+psycopg://evalops:evalops@127.0.0.1:15634/evalops_membership_test
      MEMBERSHIP_TEST_REDIS_URL: redis://127.0.0.1:18684/14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify task migrations and PostgreSQL concurrency
        run: |
          alembic check
          pytest -q tests/test_task_migration.py tests/test_offline_task_postgres.py tests/test_runner_leases_postgres.py
      - name: Prove R2 PG16 migration, concurrency and delivery contracts
        run: >-
          python -m pytest -q tests/test_invitation_migration.py
          tests/test_membership_concurrency.py tests/test_organization_invitations.py
          tests/test_membership_management.py tests/test_invitation_transport.py

  test-sdk:
    runs-on: mac-ci
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Install SDK deps
        run: |
          uv venv --python '${{ matrix.python-version }}' "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -e '.[dev]'
      - name: Run SDK tests
        run: pytest -q

  build-web:
    runs-on: mac-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web deps
        run: npm ci
      - name: Run web tests
        run: npm run test
      - name: Build web
        run: npm run build
