name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-api:
    runs-on: mac-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Install API deps
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -e '.[dev]'
      - name: Run API tests
        run: pytest -q

  test-sdk:
    runs-on: mac-ci
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - name: Install SDK deps
        run: |
          uv venv --python '${{ matrix.python-version }}' "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -e '.[dev]'
      - name: Run SDK tests
        run: pytest -q

  build-web:
    runs-on: mac-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web deps
        run: npm ci
      - name: Run web tests
        run: npm run test
      - name: Build web
        run: npm run build
