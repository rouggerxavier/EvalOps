# Production-flavoured compose for EvalOps API + Postgres.
#
# Status: documented production-flavoured compose. Validate with
# `docker compose -f docker-compose.prod.yml config` in the Docker-enabled
# deployment environment before any real deploy.
#
# Differences from `docker-compose.yml` (dev):
#  * Postgres 16 with explicit volume + healthcheck (instead of default).
#  * Synchronous SQLAlchemy URL (`postgresql+psycopg`); the API uses sync
#    SQLAlchemy and `app/db.py` already normalises async URLs to psycopg.
#  * No web service (Next.js is deployed separately in prod).
#  * Phase 7 Alembic path: dedicated `migrate` job runs
#    `alembic upgrade head` before the API starts.
#  * Conservative restart policies and explicit env contract.
#  * `EVALOPS_API_BASE_URL` / `EVALOPS_DEV_MODE` documented as required by the
#    web layer but NOT defined here — they belong to the web deployment.

x-api-base: &api-base
  image: python:3.12-slim
  working_dir: /workspace
  volumes:
    - ./apps/api:/workspace
  environment:
    APP_ENV: production
    LOG_LEVEL: INFO
    # Sync SQLAlchemy with psycopg driver — see app/db.py
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evalops}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    EVALOPS_USE_ALEMBIC: "1"
    EVALOPS_EXPORTS_DIR: ${EVALOPS_EXPORTS_DIR:-/workspace/storage/exports}
    EVALOPS_MAX_BODY_BYTES: ${EVALOPS_MAX_BODY_BYTES:-8388608}
    EVALOPS_MAX_SPANS_PER_TRACE: ${EVALOPS_MAX_SPANS_PER_TRACE:-500}
    EVALOPS_WORKER_CONCURRENCY: ${EVALOPS_WORKER_CONCURRENCY:-4}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    API_HOST: 0.0.0.0
    API_PORT: 8000

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evalops}
      POSTGRES_USER: ${POSTGRES_USER:-evalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evalops} -d ${POSTGRES_DB:-evalops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api-base
    restart: "no"
    command: >
      sh -c "pip install --no-cache-dir -c requirements.lock -e . &&
             alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-base
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir -c requirements.lock -e . &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    <<: *api-base
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir -c requirements.lock -e . &&
             python -m arq app.workers.settings.WorkerSettings"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
