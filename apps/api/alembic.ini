; Alembic config for EvalOps API.
;
; The database URL is NOT set here on purpose. ``alembic/env.py`` reads
; ``DATABASE_URL`` (or ``EVALOPS_DB_URL`` as alias) at runtime so the same
; env var that drives the app at startup drives migrations as well.
;
; Workflow (see ``docs/ops/database-migrations.md``):
;   cd apps/api
;   alembic current
;   alembic upgrade head
;   alembic downgrade -1
;
; Autogenerate (review the diff manually before committing):
;   alembic revision --autogenerate -m "short description"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
