[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops-api"
version = "0.1.0"
description = "EvalOps Studio API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "pydantic>=2.8.0,<3",
  "sqlalchemy>=2.0.32,<3",
  "PyJWT>=2.9.0,<3",
  "argon2-cffi>=23.1.0,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9",
  "httpx>=0.27.0,<1",
]

[tool.setuptools.packages.find]
where = ["."]
