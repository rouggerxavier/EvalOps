[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops-python"
version = "0.1.0"
description = "EvalOps Studio Python SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9",
]

[tool.setuptools.packages.find]
where = ["."]
