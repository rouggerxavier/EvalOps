services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evalops
      POSTGRES_USER: evalops
      POSTGRES_PASSWORD: evalops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./apps/api:/workspace
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://evalops:evalops@postgres:5432/evalops
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: >
      sh -c "pip install --no-cache-dir -e . &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./apps/web:/workspace
    environment:
      NODE_ENV: development
      PORT: 3000
    command: >
      sh -c "npm install &&
             npm run dev"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:

