services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evalops
      POSTGRES_USER: evalops
      POSTGRES_PASSWORD: evalops

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./apps/api:/workspace
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://evalops:evalops@postgres:5432/evalops
      REDIS_URL: redis://redis:6379/0
      EVALOPS_PUBLIC_ORIGIN: ${EVALOPS_PUBLIC_ORIGIN:-}
      EVALOPS_SMTP_HOST: ${EVALOPS_SMTP_HOST:-}
      EVALOPS_SMTP_PORT: ${EVALOPS_SMTP_PORT:-587}
      EVALOPS_SMTP_TLS: ${EVALOPS_SMTP_TLS:-starttls}
      EVALOPS_SMTP_FROM: ${EVALOPS_SMTP_FROM:-}
      EVALOPS_SMTP_USERNAME: ${EVALOPS_SMTP_USERNAME:-}
      EVALOPS_SMTP_PASSWORD: ${EVALOPS_SMTP_PASSWORD:-}
      EVALOPS_SMTP_TIMEOUT_SECONDS: ${EVALOPS_SMTP_TIMEOUT_SECONDS:-10}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: >
      sh -c "pip install --no-cache-dir -c requirements.lock -e . &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8000"

  worker:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./apps/api:/workspace
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://evalops:evalops@postgres:5432/evalops
      REDIS_URL: redis://redis:6379/0
      EVALOPS_PUBLIC_ORIGIN: ${EVALOPS_PUBLIC_ORIGIN:-}
      EVALOPS_SMTP_HOST: ${EVALOPS_SMTP_HOST:-}
      EVALOPS_SMTP_PORT: ${EVALOPS_SMTP_PORT:-587}
      EVALOPS_SMTP_TLS: ${EVALOPS_SMTP_TLS:-starttls}
      EVALOPS_SMTP_FROM: ${EVALOPS_SMTP_FROM:-}
      EVALOPS_SMTP_USERNAME: ${EVALOPS_SMTP_USERNAME:-}
      EVALOPS_SMTP_PASSWORD: ${EVALOPS_SMTP_PASSWORD:-}
      EVALOPS_SMTP_TIMEOUT_SECONDS: ${EVALOPS_SMTP_TIMEOUT_SECONDS:-10}
      EVALOPS_WORKER_CONCURRENCY: "4"
    command: >
      sh -c "pip install --no-cache-dir -c requirements.lock -e . &&
             python -m arq app.workers.settings.WorkerSettings"
    depends_on:
      - postgres
      - redis

  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./apps/web:/workspace
    environment:
      NODE_ENV: development
      PORT: 3000
    command: >
      sh -c "npm install &&
             npm run dev"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:

